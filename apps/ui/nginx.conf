server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Angular's output hashing makes these file names change on every build, so they can be cached forever.
  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Local compose mounts an /api proxy here; in AWS the load balancer routes /api before nginx.
  include /etc/nginx/conf.d/locations/*.conf;
}
