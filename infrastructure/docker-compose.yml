name: petfinder

services:
  postgres:
    image: postgres:17-alpine
    container_name: petfinder-postgres
    restart: unless-stopped
    # Compose only reads .env next to this file, so the root .env is passed in explicitly.
    env_file: ../.env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  floci:
    image: floci/floci:2.5.0
    container_name: petfinder-floci
    restart: unless-stopped
    # floci's API is unauthenticated, so never expose it beyond loopback.
    ports:
      - '127.0.0.1:4566:4566'
      - '127.0.0.1:7001-7099:7001-7099' # RDS proxy ports
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      # floci runs RDS, ECS and Lambda as sibling containers on the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.floci:/app/data

volumes:
  postgres-data:
