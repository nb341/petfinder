name: petfinder

services:
  postgres:
    build: ./postgres
    image: petfinder-postgres:local
    container_name: petfinder-postgres
    restart: unless-stopped
    # Compose only reads .env next to this file, so the root .env is passed in explicitly.
    env_file: ../../.env
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  floci:
    image: floci/floci:2.5.0
    container_name: petfinder-floci
    restart: unless-stopped
    # floci's API is unauthenticated, so never expose it beyond loopback.
    ports:
      - '127.0.0.1:4566:4566'
      - '127.0.0.1:7001-7099:7001-7099' # RDS proxy ports
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    volumes:
      # floci runs RDS, ECS and Lambda as sibling containers on the host's Docker.
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.floci:/app/data

  # The app images are opt-in: docker compose --profile apps up -d --build
  api:
    profiles: [apps]
    build:
      context: ../..
      target: api
    image: petfinder-api:local
    container_name: petfinder-api
    env_file: ../../.env
    environment:
      # Overrides the root .env's localhost URL; inside compose, Postgres is reached by service name.
      DATABASE_URL: postgresql://${POSTGRES_USER:-petfinder}:${POSTGRES_PASSWORD:-petfinder}@postgres:5432/${POSTGRES_DB:-petfinder}
      DB_RUN_MIGRATIONS: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    profiles: [apps]
    build:
      context: ../..
      target: ui
    image: petfinder-ui:local
    container_name: petfinder-ui
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./nginx:/etc/nginx/conf.d/locations:ro
    depends_on:
      - api

volumes:
  postgres-data:
